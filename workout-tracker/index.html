/* ---------- 29 Oct 2026, user-requested: put Shrugs back ---------- */
// An earlier update moved shrugs off the day they were logged on. They go
// back to the day their progress was tracked on (latest saved session with
// shrug numbers; Pull day if there is none), so "last time" and the strength
// trend line up again. Pulled from wherever they are now, or the restore
// bin, or rebuilt from History if they were deleted outright.
function returnShrugs() {
  const FLAG = 'workout_tracker_return_shrugs_v1';
  if (load(FLAG)) return;
  save('workout_tracker_move_shrugs_v1', true); // the old move never runs again
  const SHRUG = /shrug/i;
  const logged = history
    .filter(h => data.order.includes(h.day) && (h.exercises || []).some(e => SHRUG.test(e.name) && (e.sets || []).some(setHasValue)))
    .sort((a, b) => b.date.localeCompare(a.date))[0];
  const home = logged ? logged.day : data.order.find(d => /pull/i.test(d));
  if (!home) { save(FLAG, true); return; }
  const homeList = data.days[home];
  if (homeList.some(e => SHRUG.test(e.name))) { save(FLAG, true); return; }
  let ex = null;
  data.order.forEach(day => {
    if (ex || day === home) return;
    const list = data.days[day] || [];
    const i = list.findIndex(e => SHRUG.test(e.name));
    if (i === -1) return;
    if (list[i].sets.some(setHasValue) && data.sessionDate && data.sessionDate[day]) {
      const date = data.sessionDate[day];
      if (!history.some(h => h.day === day && h.date === date)) {
        const snap = buildSnapshot(day, date); snap.autoArchived = true; storeSnapshot(snap);
      }
    }
    ex = list.splice(i, 1)[0];
    ex.sets = ex.sets.map(() => ({}));
  });
  if (!ex && data.trash) {
    const ti = data.trash.findIndex(t => SHRUG.test(t.ex.name));
    if (ti !== -1) { ex = data.trash.splice(ti, 1)[0].ex; ex.sets = ex.sets.map(() => ({})); }
  }
  if (!ex) {
    const e = logged && logged.exercises.find(x => SHRUG.test(x.name));
    const name = e ? e.name : 'Shrugs';
    const n = e ? Math.max(3, e.sets.filter(setHasValue).length) : 3;
    ex = { name, target: `${n} sets x 12-15 reps`, sets: Array.from({ length: n }, () => ({})),
      allVariants: [name], variantIndex: 0, anchor: false, lastRotated: todayStr() };
    if (e && e.mode) ex.mode = e.mode;
  }
  ex.anchor = false;
  homeList.push(ex);
  persist();
  save(FLAG, true);
}
returnShrugs();

function updateSessionProgress() {

<div id="installBar" hidden style="position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:950;max-width:608px;margin:0 auto;background:var(--card);border:1px solid var(--accent);border-radius:14px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 6px 20px rgba(0,0,0,.18)">

  <div style="display:flex;gap:6px;flex:none"><button id="installLater" class="secondary" style="min-height:40px;padding:8px 12px">Later</button><button id="installBtn" class="primary" style="flex:none;padding:8px 14px">Install</button></div>

<div id="updateBar" hidden style="position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:960;max-width:608px;margin:0 auto;background:var(--accent);color:var(--ink);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600">
  <span>Update available</span><button id="updateBtn" style="background:var(--ink);color:var(--accent);border:none;border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer">Refresh</button>
</div>
<script>
// ---- App shell: offline cache, updates, install button, move-your-data banner ----
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(reg => {
    const show = w => { document.getElementById('updateBar').hidden = false; document.getElementById('updateBtn').onclick = () => w.postMessage('skip'); };
    if (reg.waiting && navigator.serviceWorker.controller) show(reg.waiting);
    reg.addEventListener('updatefound', () => { const w = reg.installing; w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) show(w); }); });
    setInterval(() => reg.update(), 60 * 60 * 1000);

(function () {
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  let deferred = null;
  const bar = document.getElementById('installBar');
  const later = () => { try { return localStorage.getItem('wt_app_install_later') === '1'; } catch (e) { return false; } };
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; if (!standalone && !later()) bar.hidden = false; });
  document.getElementById('installBtn').addEventListener('click', async () => { if (!deferred) return; deferred.prompt(); try { await deferred.userChoice; } catch (e) {} deferred = null; bar.hidden = true; });
  document.getElementById('installLater').addEventListener('click', () => { bar.hidden = true; try { localStorage.setItem('wt_app_install_later', '1'); } catch (e) {} });
  window.addEventListener('appinstalled', () => { bar.hidden = true; });

  // First open with no history yet: point to Backup / restore to bring the old log across.
  let hasHistory = false;
  try { hasHistory = (JSON.parse(localStorage.getItem('workout_tracker_history_v2')) || []).length > 0; } catch (e) {}
  let dismissed = false;
  try { dismissed = localStorage.getItem('wt_app_move_dismissed') === '1'; } catch (e) {}
  if (!hasHistory && !dismissed) {
    const el = document.createElement('div');
    el.className = 'banner info';
    el.innerHTML = '<div><strong>Moving from the old tracker?</strong><br>In the old one: 💾 Backup / restore → Copy backup. Here: 💾 Backup / restore → paste it under Restore → Restore from backup.</div>' +
      '<div style="display:flex;flex-direction:column;gap:6px"><button class="primary" id="moveOpen" style="padding:8px 12px">Open restore</button><button class="del-btn" id="moveDismiss" aria-label="Dismiss">Not now</button></div>';
    const wrap = document.querySelector('.wrap header');
    if (wrap) wrap.insertAdjacentElement('afterend', el);
    el.addEventListener('click', ev => {
      if (ev.target.id === 'moveDismiss') { el.remove(); try { localStorage.setItem('wt_app_move_dismissed', '1'); } catch (e) {} }
      if (ev.target.id === 'moveOpen') {

        setTimeout(() => { const box = document.getElementById('backupIn'); if (box) { box.scrollIntoView({ behavior: 'smooth', block: 'center' }); box.focus(); } }, 120);

</script>
