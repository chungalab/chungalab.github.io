<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Workout Tracker</title>
<meta name="theme-color" content="#111316">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<meta name="description" content="Personal workout tracker: sets, reps, progress and stretches.">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>[hidden]:not([hidden=until-found i]){display:none!important} img{max-width:100%}</style>
<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --border: #e5e5e2;
    --accent: #d4622a;
    --accent-soft: #fdeee5;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161513; --card: #201f1c; --text: #f0efec;
      --muted: #9a988f; --border: #34322c; --accent: #e8834a; --accent-soft: #3a2416;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161513; --card: #201f1c; --text: #f0efec;
    --muted: #9a988f; --border: #34322c; --accent: #e8834a; --accent-soft: #3a2416;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100%; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 60px; }
  header { margin-bottom: 16px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 0.88rem; }

  .day-tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 6px;
    margin-bottom: 16px;
    -webkit-overflow-scrolling: touch;
  }
  .day-tab {
    flex: none;
    padding: 8px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 0.88rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .day-tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  .day-tab.add {
    color: var(--accent);
    border-style: dashed;
  }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .ex-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .ex-name { font-weight: 600; font-size: 1.05rem; outline: none; }
  .ex-target { color: var(--muted); font-size: 0.82rem; outline: none; margin-top: 2px; }
  .set-row { display: grid; grid-template-columns: 28px 1fr 1fr 32px; gap: 8px; align-items: center; margin-bottom: 8px; }
  .set-num { color: var(--muted); font-size: 0.85rem; text-align: center; }
  input { width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 0.95rem; }
  input::placeholder { color: var(--muted); opacity: 0.7; }
  .del-btn { background: none; border: none; color: var(--muted); font-size: 1.1rem; cursor: pointer; padding: 4px; }
  .add-set { background: none; border: 1px dashed var(--border); color: var(--accent); border-radius: 8px; padding: 7px; width: 100%; font-size: 0.85rem; cursor: pointer; margin-top: 2px; }
  .top-actions { display: flex; gap: 8px; margin-bottom: 16px; }
  button.primary { background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 11px 16px; font-size: 0.95rem; font-weight: 600; cursor: pointer; flex: 1; }
  button.secondary { background: var(--accent-soft); color: var(--accent); border: none; border-radius: 10px; padding: 12px; min-height: 44px; font-size: 0.85rem; cursor: pointer; white-space: nowrap; }
  .history { font-size: 0.85rem; color: var(--muted); margin-top: 6px; padding-top: 8px; border-top: 1px solid var(--border); }
  .history strong { color: var(--text); }
  .toast { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--accent); color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 0.88rem; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
  .toast.show { opacity: 1; }
  .empty-note { color: var(--muted); font-size: 0.85rem; }
  .day-name-row { display:flex; align-items:center; justify-content:space-between; margin-bottom: 14px; }
  .day-title { font-size: 1.1rem; font-weight: 600; outline: none; }
  .del-day { color: var(--muted); background:none; border:none; font-size:0.8rem; cursor:pointer; text-decoration: underline; }

  /* v2 additions: set rows with RIR + done tick, rest bar, banners, volume bars */
  :root { --good: #2e8b57; --warn: #b7791f; --bad: #c0392b; --good-soft: #e6f4ec; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --good: #5cc28a; --warn: #e0a84a; --bad: #e46a5c; --good-soft: #17301f; color-scheme: dark; } }
  :root[data-theme="dark"] { --good: #5cc28a; --warn: #e0a84a; --bad: #e46a5c; --good-soft: #17301f; color-scheme: dark; }
  .set-row.v2 { grid-template-columns: 20px minmax(0,1fr) minmax(0,1fr) 46px 36px 24px; gap: 6px; }
  .set-row.v2.single { grid-template-columns: 20px minmax(0,1fr) 46px 36px 24px; }
  .set-row.done input { background: var(--good-soft); border-color: var(--good); }
  .rir-input { padding: 9px 4px; text-align: center; font-size: 0.85rem; }
  .done-btn { width: 36px; height: 38px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--muted); font-size: 1rem; cursor: pointer; padding: 0; }
  .done-btn.on { background: var(--good); border-color: var(--good); color: #fff; }
  .col-heads { display: grid; grid-template-columns: 20px minmax(0,1fr) minmax(0,1fr) 46px 36px 24px; gap: 6px; font-size: 0.66rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; }
  .col-heads.single { grid-template-columns: 20px minmax(0,1fr) 46px 36px 24px; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { font-size: 0.72rem; color: var(--accent); background: var(--accent-soft); border: none; border-radius: 12px; padding: 4px 9px; cursor: pointer; }
  .ex-note { font-size: 0.78rem; color: var(--muted); font-style: italic; margin-top: 4px; }
  .banner { border-radius: 12px; padding: 12px; margin-bottom: 12px; font-size: 0.84rem; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
  .banner.info { background: var(--accent-soft); border: 1px solid var(--accent); }
  .banner.calm { background: var(--card); border: 1px solid var(--border); }
  .banner button { flex: none; }
  .rest-bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--text); color: var(--bg); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 10px; z-index: 900; font-variant-numeric: tabular-nums; }
  .rest-bar[hidden] { display: none !important; }
  .rest-bar .t { font-size: 1.4rem; font-weight: 700; min-width: 64px; }
  .rest-bar .lbl { flex: 1; font-size: 0.8rem; opacity: 0.8; min-width: 0; }
  .rest-bar button { background: transparent; color: var(--bg); border: 1px solid currentColor; border-radius: 8px; padding: 6px 10px; font-size: 0.8rem; cursor: pointer; }
  .vol-row { display: grid; grid-template-columns: 92px minmax(0,1fr) 40px; gap: 8px; align-items: center; font-size: 0.8rem; margin-bottom: 8px; }
  .vol-track { position: relative; height: 10px; background: var(--bg); border-radius: 5px; overflow: hidden; }
  .vol-band { position: absolute; top: 0; bottom: 0; background: var(--good-soft); }
  .vol-fill { position: absolute; top: 2px; bottom: 2px; left: 0; border-radius: 3px; }
  .num { font-variant-numeric: tabular-nums; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 12px; }
  .seg button { flex: 1; min-width: 70px; padding: 8px 6px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 0.8rem; cursor: pointer; }
  .seg button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  textarea { width: 100%; min-height: 120px; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font: 0.78rem ui-monospace, Menlo, monospace; }
  body.resting .wrap { padding-bottom: 110px; }
  body.resting .toast { bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
  .spark { display:grid; grid-template-columns: minmax(0,1fr) 120px 56px; gap: 8px; align-items:center; font-size:0.8rem; margin-bottom:6px; }

/* ===== Iron theme (Oct 2026): graphite and steel, one brass accent like a plate rim.
   Dark everywhere on purpose: it's used under gym lights between sets.
   Selectors are doubled up so they win over the older light/dark blocks above. ===== */
:root:root:root {
  color-scheme: dark;
  --bg: #111316;          /* iron */
  --card: #1a1d22;        /* steel plate */
  --card-2: #22262c;
  --text: #e8eaed;        /* chalk */
  --muted: #8a919b;
  --border: #2a2f37;
  --accent: #c9a24a;      /* brass */
  --accent-soft: #2a2418;
  --ink: #16120a;         /* text on brass */
  --good: #57b882; --good-soft: #15281d;
  --warn: #d9a441; --bad: #e0574f;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
body { background: var(--bg); color: var(--text); font-family: var(--font-body); -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
header { margin-bottom: 18px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.9rem; letter-spacing: 0.03em; text-transform: uppercase; }
header .sub { font-size: 0.85rem; }
/* knurling: the crosshatch grip on a barbell, as a strip under the title */
header::after { content: ""; display: block; height: 7px; margin-top: 12px; border-radius: 2px; opacity: 0.55;
  background: repeating-linear-gradient(45deg, var(--muted) 0 1px, transparent 1px 4px), repeating-linear-gradient(-45deg, var(--muted) 0 1px, transparent 1px 4px); }
.day-tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--bg); padding-top: 8px; margin-top: -8px; scrollbar-width: none; }
.day-tabs::-webkit-scrollbar { display: none; }
.day-tab { font-family: var(--font-display); font-weight: 600; font-size: 1rem; letter-spacing: 0.03em; text-transform: uppercase; background: var(--card); border-color: var(--border); color: var(--muted); padding: 8px 16px; }
.day-tab.active { background: var(--accent); border-color: var(--accent); color: var(--ink); }
.day-tab.add { color: var(--accent); background: transparent; }
.day-title { font-family: var(--font-display); font-size: 1.35rem; letter-spacing: 0.02em; text-transform: uppercase; }
.card { background: var(--card); border-color: var(--border); border-radius: 16px; }
.ex-name { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; letter-spacing: 0.02em; text-transform: uppercase; line-height: 1.15; }
.ex-target { font-variant-numeric: tabular-nums; }
input, textarea, select { background: var(--bg); border-color: var(--border); color: var(--text); font-size: 16px; }
input:focus, textarea:focus { border-color: var(--accent); outline: none; }
input[type="number"] { font-variant-numeric: tabular-nums; }
button.primary { color: var(--ink); font-family: var(--font-display); font-size: 1.1rem; letter-spacing: 0.04em; text-transform: uppercase; }
button.secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
button.secondary:hover { border-color: var(--accent); }
.top-actions button.secondary { color: var(--accent); }
.add-set { border-color: var(--border); color: var(--accent); }
.chip { background: var(--card-2); color: var(--text); border: 1px solid var(--border); }
.done-btn { background: var(--bg); border-color: var(--border); }
.done-btn.on { color: var(--ink); }
.set-row.done input { background: var(--good-soft); border-color: var(--good); }
.seg button { background: var(--bg); border-color: var(--border); color: var(--text); }
.seg button.on { color: var(--ink); }
.toast { color: var(--ink); font-weight: 600; }
.banner.info { background: var(--accent-soft); border-color: var(--accent); }
.banner.calm { background: var(--card); border-color: var(--border); }
.rest-bar { background: var(--accent); color: var(--ink); }
.rest-bar button { color: var(--ink); }
.history { border-top-color: var(--border); }
.vol-track { background: var(--bg); }
/* session progress */
.session-progress { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 6px 12px; margin: -4px 0 14px; }
.session-progress .lbl { font-size: 0.8rem; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
.session-progress .num { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; color: var(--text); }
.session-progress .track { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--card-2); overflow: hidden; }
.session-progress .fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width .25s; }
.session-progress.complete .fill { background: var(--good); }
@media (prefers-reduced-motion: reduce) { .session-progress .fill { transition: none; } }

</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🏋️ My Workout Tracker</h1>
    <div class="sub">Switch workouts, log sets, track progress over time</div>
  </header>

  <div class="day-tabs" id="dayTabs"></div>

  <div class="day-name-row">
    <div class="day-title" id="dayTitle" contenteditable="true"></div>
    <button class="del-day" id="deleteDayBtn">delete this workout</button>
  </div>

  <div class="session-progress" id="sessionProgress" hidden><span class="lbl">Today's sets</span><span class="num" id="spNum">0 / 0</span><div class="track"><div class="fill" id="spFill" style="width:0%"></div></div></div>
  <div id="mesoBanner"></div>
  <div id="rolloverBanner"></div>
  <div id="rampBanner"></div>

  <div class="top-actions">
    <button class="primary" id="saveBtn">Save today's session</button>
    <button class="secondary" id="historyBtn">History</button>
    <button class="secondary" id="shareBtn">Share</button>
  </div>

  <div id="debugStatus" style="font-size:0.72rem; color:var(--muted); margin:-8px 0 12px; min-height:14px;"></div>

  <div id="exercises"></div>

  <div style="display:flex; gap:8px; margin-top:4px;">
    <button class="secondary" id="addExerciseBtn" style="flex:1;">+ Add exercise</button>
    <button class="secondary" id="restoreToggleBtn" style="flex:1;">♻️ Restore removed exercises</button>
  </div>
  <div id="restorePanel" style="display:none; margin-top:10px;"></div>

  <button class="secondary" id="nutritionBtn" style="width:100%; margin-top:10px;">🥗 Nutrition & Stretches</button>

  <button class="secondary" id="timerToggleBtn" style="width:100%; margin-top:10px;">⏱️ Session Timer (10 / 60 / 10 = 80 min)</button>

  <button class="secondary" id="playlistToggleBtn" style="width:100%; margin-top:10px;">🎧 Workout Playlist</button>
  <div id="playlistPanel" style="display:none;"></div>

  <button class="secondary" id="bwToggleBtn" style="width:100%; margin-top:10px;">⚖️ Bodyweight Log</button>

  <button class="secondary" id="volumeToggleBtn" style="width:100%; margin-top:10px;">📊 Weekly sets per muscle</button>

  <div style="display:flex; gap:8px; margin-top:10px;">
    <button class="secondary" id="freshStartBtn" style="flex:1;">🧹 Clear sets for a new session</button>
    <button class="secondary" id="backupToggleBtn" style="flex:1;">💾 Backup / restore</button>
  </div>

  <div id="volumePanel" style="display:none;"></div>
  <div id="backupPanel" style="display:none;"></div>
  <div id="historyPanel" style="display:none;"></div>
  <div id="nutritionPanel" style="display:none;"></div>
  <div id="timerPanel" style="display:none;"></div>
  <div id="bodyweightPanel" style="display:none;"></div>
</div>

<div class="toast" id="toast">Saved ✓</div>

<div class="rest-bar" id="restBar" hidden>
  <div class="t" id="restTime">0:00</div>
  <div class="lbl" id="restLabel">Rest</div>
  <button id="restMinus">−15s</button>
  <button id="restPlus">+15s</button>
  <button id="restSkip">Skip</button>
</div>

<script>
// Local calendar date (YYYY-MM-DD). The old code used UTC, which in Nairobi
// rolled the date late at night; local keeps "today" matching the gym clock.
function todayStr(d) {
  const x = d ? new Date(d) : new Date();
  return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
}
function addDays(dateStr, n) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return todayStr(new Date(y, m - 1, d + n));
}
function daysBetween(a, b) {
  const [y1, m1, d1] = a.split('-').map(Number), [y2, m2, d2] = b.split('-').map(Number);
  return Math.round((new Date(y2, m2 - 1, d2) - new Date(y1, m1 - 1, d1)) / 86400000);
}
// Per-day stretch libraries: dynamic moves before training, static holds after.
// Each entry is {name, detail, cue} — cue is a short form/safety note.
// This is SEED data only; the live, editable copy lives in localStorage (see stretchData below),
// so the user can rename/edit/delete/add stretches per day and it persists.
const DEFAULT_STRETCHES = {
  "Day 1 - Legs": {
    pre: [
      { name: "Bodyweight squats", detail: "10 slow reps, full range", cue: "Keep chest up, knees tracking over toes" },
      { name: "Walking lunges", detail: "6 each leg", cue: "Front knee stays behind toes, controlled step" },
      { name: "Leg swings", detail: "10 each leg, front-back and side-side", cue: "Hold something for balance, don't force the range" },
      { name: "Hip circles", detail: "10 each direction", cue: "Keep core braced, move from the hip" },
      { name: "Glute bridges", detail: "12 reps", cue: "Squeeze glutes at the top, avoid arching the lower back" },
      { name: "Ankle bounces / light skips", detail: "20 sec", cue: "Stay light on the balls of your feet" },
    ],
    post: [
      { name: "Standing quad stretch", detail: "30 sec each leg", cue: "Keep knees together, don't yank the foot" },
      { name: "Seated hamstring stretch", detail: "30 sec each leg", cue: "Hinge from the hips, keep back long, don't round it" },
      { name: "Calf stretch against wall", detail: "30 sec each leg", cue: "Keep heel flat, back leg straight" },
      { name: "Figure-4 glute stretch", detail: "30 sec each side", cue: "Keep back flat, ease in rather than pull hard" },
      { name: "Kneeling hip flexor stretch", detail: "30 sec each side", cue: "Tuck pelvis slightly — feel it in the hip, not the back" },
    ],
  },
  "Day 2 - Push": {
    pre: [
      { name: "Arm circles", detail: "10 forward, 10 backward", cue: "Small circles first, then bigger — controlled, not flailing" },
      { name: "Shoulder rolls", detail: "10 each direction", cue: "Full range, relax the neck" },
      { name: "Push-up to downward dog", detail: "8 slow reps", cue: "Keep core tight through the push-up" },
      { name: "Band pull-aparts (or arm pulses)", detail: "15 reps", cue: "Squeeze shoulder blades together, don't shrug" },
      { name: "Torso twists", detail: "10 each side", cue: "Rotate from the core, hips stay facing forward" },
    ],
    post: [
      { name: "Doorway chest stretch", detail: "30 sec each side", cue: "Lean in gently, stop at mild tension not pain" },
      { name: "Overhead triceps stretch", detail: "30 sec each arm", cue: "Keep elbow close to the head, don't force it down" },
      { name: "Cross-body shoulder stretch", detail: "30 sec each arm", cue: "Use the opposite arm to gently pull, shoulders stay down" },
      { name: "Child's pose, reaching forward", detail: "Hold 30-45 sec", cue: "Sit hips back toward heels, relax the shoulders" },
    ],
  },
  "Day 3 - Pull": {
    pre: [
      { name: "Arm swings", detail: "10 each direction", cue: "Loosen the shoulders, controlled not violent" },
      { name: "Cat-cow", detail: "8 slow reps", cue: "Move with your breath, full spine articulation" },
      { name: "Scapular pulls / light band rows", detail: "12 reps", cue: "Pull shoulder blades together, avoid using momentum" },
      { name: "Torso rotations", detail: "10 each side", cue: "Keep hips stable, rotate through the upper back" },
    ],
    post: [
      { name: "Overhead lat stretch (lean to side)", detail: "30 sec each side", cue: "Reach up and over, feel it along the side body" },
      { name: "Doorframe bicep stretch", detail: "30 sec each arm", cue: "Straighten the arm gently, palm facing back" },
      { name: "Seated forward fold (lower back)", detail: "Hold 30-45 sec", cue: "Hinge from the hips, let the back round slightly — don't force it" },
      { name: "Cross-body shoulder stretch", detail: "30 sec each arm", cue: "Use the opposite arm to gently pull, shoulders stay down" },
    ],
  },
  "Day 4 - Upper/Core": {
    pre: [
      { name: "Arm circles", detail: "10 forward, 10 backward", cue: "Small then bigger, controlled" },
      { name: "Plank shoulder taps", detail: "10 each side", cue: "Keep hips still, brace core to avoid rocking" },
      { name: "Cat-cow", detail: "8 slow reps", cue: "Move with your breath" },
      { name: "Torso twists", detail: "10 each side", cue: "Rotate from the core, hips face forward" },
      { name: "Hip circles", detail: "10 each direction", cue: "Keep core braced" },
    ],
    post: [

// User-requested equipment swaps: Romanian Deadlift is done with dumbbells
// (not barbell), and Incline Press is done with a barbell (not dumbbells).
// Renames whichever variant is currently active and folds the new name into
// its rotation list so future swaps still work correctly. Safe to call every
// load — no-ops once already adjusted.
function adjustEquipmentPreferences() {
  const today = todayStr();

  function retarget(dayMatcher, candidateNames, newName) {
    const dayName = data.order.find(d => dayMatcher.test(d));
    if (!dayName) return;
    const list = data.days[dayName];
    const idx = list.findIndex(ex => candidateNames.includes(ex.name));
    // A slot that alternates weekly (e.g. incline barbell / dumbbell) is left alone.
    if (idx === -1 || list[idx].name === newName || list[idx].alternateWeekly) return;
    const oldName = list[idx].name;
    list[idx].name = newName;
    if (list[idx].allVariants && list[idx].allVariants.length) {
      const pos = list[idx].allVariants.indexOf(newName);
      if (pos === -1) { list[idx].allVariants.unshift(newName); list[idx].variantIndex = 0; }
      else { list[idx].variantIndex = pos; }
    } else {
      list[idx].allVariants = [newName];
      list[idx].variantIndex = 0;
    }
    list[idx].lastRotated = today;
    persist();

    // Keep past logged sessions linked under the new name so progression
    // tracking doesn't silently reset just because of an equipment relabel.
    let historyChanged = false;
    history.forEach(h => {
      if (h.day !== dayName) return;
      h.exercises.forEach(e => { if (e.name === oldName) { e.name = newName; historyChanged = true; } });
    });
    if (historyChanged) save(HISTORY_KEY, history);
  }

  retarget(/legs/i, ['Romanian Deadlift', 'Good Mornings', 'Single-Leg RDL', 'Romanian Deadlift (Dumbbell)'], 'Romanian Deadlift (Dumbbell)');
  retarget(/push/i, ['Incline Dumbbell Press', 'Incline Barbell Press', 'Machine Chest Press'], 'Incline Barbell Press');
}

// How each exercise is logged:
//   'weight' = weight (kg) x reps   (default, for loaded lifts)
//   'reps'   = reps only             (bodyweight moves, e.g. leg raises)
//   'time'   = seconds held          (holds, e.g. planks)
// An explicit ex.mode (set via the tap-to-change chip) wins; otherwise the
// mode is inferred from the exercise name.
const MODE_LABELS = { weight: 'kg × reps', reps: 'reps only (bodyweight)', time: 'seconds (hold)' };
function inferMode(name) {
  const n = (name || '').toLowerCase();
  if (/plank|hold|dead hang|wall sit/.test(n)) return 'time';
  if (/leg raise|dead bug|ab wheel|push-up|pushup|sit-up|crunch(?!.*cable)/.test(n)) return 'reps';
  return 'weight';
}
function modeFor(ex) { return (ex && ex.mode) || inferMode(ex && ex.name); }
function formatSets(sets, mode) {
  return (sets || []).filter(s => s.weight || s.reps || s.secs).map(s => {
    if (mode === 'time') return `${s.secs || s.reps || '-'} sec`;
    if (mode === 'reps') return `${s.reps || '-'} reps`;
    return `${s.weight || '-'}kg x ${s.reps || '-'}`;
  }).join(', ');
}

// Correction (user clarified): Plank is NOT weighted — it's logged in
// seconds per set (4 sets x 60 sec). Leg raises are NOT weighted either —

function fixBodyweightCoreMoves() {
  const FLAG = 'workout_tracker_core_modes_fixed_v1';
  if (load(FLAG)) return;
  Object.keys(data.days).forEach(dayName => {
    data.days[dayName].forEach(ex => {
      if (/plank/i.test(ex.name)) {
        ex.mode = 'time';
        ex.target = '4 sets x 60 sec';
        while (ex.sets.length < 4) ex.sets.push({});
        ex.sets.forEach(s => {
          if (!s.secs && s.reps) s.secs = s.reps;
          delete s.weight; delete s.reps;
        });
      } else if (/leg raise/i.test(ex.name)) {
        ex.mode = 'reps';
        ex.target = `${ex.sets.length || 3} sets x 15 reps`;
        ex.sets.forEach(s => { delete s.weight; });

  history.forEach(h => (h.exercises || []).forEach(e => {

// If a history entry's "day" label no longer exists in the current day order
// (e.g. it was saved back when leg day was named/ordered differently), find
// the current day whose exercises best match that entry's exercises and
// relink it there — so no saved session goes missing after reordering/renaming days.
function migrateOrphanedHistory() {
  try {
    let changed = false;
    history.forEach(entry => {
      if (!entry || !Array.isArray(entry.exercises)) return; // skip malformed entries, don't crash
      if (data.order.includes(entry.day)) return; // already matches a current day, leave it alone
      const entryNames = new Set(entry.exercises.map(e => e && e.name).filter(Boolean));
      let bestDay = null, bestScore = 0;
      data.order.forEach(dayName => {
        const dayNames = (data.days[dayName] || []).map(e => e.name);
        const overlap = dayNames.filter(n => entryNames.has(n)).length;
        if (overlap > bestScore) { bestScore = overlap; bestDay = dayName; }
      });
      if (bestDay && bestScore > 0) {
        entry.day = bestDay;
        changed = true;
      }
    });
    if (changed) save(HISTORY_KEY, history);
  } catch (e) {
    console.error('history migration failed, continuing without it', e);
  }
}

function load(key) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { console.error('load failed', key, e); return null; }
}
function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); }
  catch (e) { console.error('save failed', key, e); }
}
function persist() { save(STATE_KEY, data); }
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

// Inline replacement for prompt()/confirm() — native browser dialogs can be
// silently blocked inside a sandboxed hosting environment, which made
// "+ New workout" (and similar buttons) appear completely dead with zero
// feedback. This renders a real on-page dialog instead, so it always works.
function showInlineDialog({ message, showInput, inputPlaceholder, confirmText, cancelText, danger, onConfirm }) {
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:1000; padding:20px;';
  const box = document.createElement('div');
  box.style.cssText = 'background:var(--card); border-radius:14px; padding:20px; max-width:360px; width:100%; border:1px solid var(--border);';
  box.innerHTML = `
    <div style="margin-bottom:14px; color:var(--text);">${escapeHtml(message)}</div>
    ${showInput ? `<input id="inlineDialogInput" type="text" placeholder="${escapeHtml(inputPlaceholder || '')}" style="margin-bottom:14px;">` : ''}
    <div style="display:flex; gap:8px; justify-content:flex-end;">
      <button id="inlineDialogCancel" class="secondary" style="padding:9px 14px;">${escapeHtml(cancelText || 'Cancel')}</button>
      <button id="inlineDialogConfirm" class="primary" style="flex:none; padding:9px 14px;${danger ? ' background:var(--bad);' : ''}">${escapeHtml(confirmText || 'OK')}</button>
    </div>
  `;
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  const input = box.querySelector('#inlineDialogInput');
  if (input) setTimeout(() => input.focus(), 50);
  const close = () => overlay.remove();
  box.querySelector('#inlineDialogCancel').addEventListener('click', close);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
  box.querySelector('#inlineDialogConfirm').addEventListener('click', () => {
    const value = input ? input.value.trim() : true;
    close();
    onConfirm(value);
  });
  if (input) input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') box.querySelector('#inlineDialogConfirm').click();
  });
}

}

// Multi-field version of the inline dialog, for editing/adding a stretch
// (name + dosage + safety cue) in one go instead of three sequential popups.
function showInlineFormDialog({ title, fields, confirmText, onConfirm, onDelete }) {
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:1000; padding:20px;';
  const box = document.createElement('div');
  box.style.cssText = 'background:var(--card); border-radius:14px; padding:20px; max-width:380px; width:100%; border:1px solid var(--border); max-height:85vh; overflow-y:auto;';
  const fieldsHtml = fields.map((f, i) => `
    <div style="margin-bottom:12px;">
      <div style="font-size:0.78rem; color:var(--muted); margin-bottom:4px;">${escapeHtml(f.label)}</div>
      <input id="formField${i}" type="text" placeholder="${escapeHtml(f.placeholder || '')}" value="${escapeHtml(f.value || '')}">
    </div>`).join('');
  box.innerHTML = `
    <div style="font-weight:600; margin-bottom:14px; color:var(--text);">${escapeHtml(title)}</div>
    ${fieldsHtml}
    <div style="display:flex; gap:8px; justify-content:${onDelete ? 'space-between' : 'flex-end'}; margin-top:6px;">
      ${onDelete ? `<button id="formDialogDelete" class="del-day" style="color:var(--bad);">Delete stretch</button>` : ''}
      <div style="display:flex; gap:8px;">
        <button id="formDialogCancel" class="secondary" style="padding:9px 14px;">Cancel</button>
        <button id="formDialogConfirm" class="primary" style="flex:none; padding:9px 14px;">${escapeHtml(confirmText || 'Save')}</button>
      </div>
    </div>
  `;
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  const firstInput = box.querySelector('#formField0');
  if (firstInput) setTimeout(() => firstInput.focus(), 50);
  const close = () => overlay.remove();
  box.querySelector('#formDialogCancel').addEventListener('click', close);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
  if (onDelete) {
    box.querySelector('#formDialogDelete').addEventListener('click', () => { close(); showInlineDialog({ message: 'Delete this stretch?', confirmText: 'Yes, delete', cancelText: 'No', danger: true, onConfirm: onDelete }); });
  }
  box.querySelector('#formDialogConfirm').addEventListener('click', () => {
    const values = fields.map((f, i) => box.querySelector('#formField' + i).value.trim());
    close();
    onConfirm(values);
  });
}

// Double-progression check: if the target has a rep range (e.g. "3 sets x
// 8-10 reps") and the most recent logged session for this exercise+day hit
// the TOP of that range on every logged set, it's time to add weight next
// time rather than more reps. Targets without a numeric range (time holds,
// fixed single rep counts) are skipped — nothing to compare against.
function getProgressionStatus(ex) {
  if (modeFor(ex) !== 'weight') return false; // bodyweight/time moves: no "+2.5kg" advice
  const match = (ex.target || '').match(/(\d+)\s*-\s*(\d+)\s*reps?/i);
  if (!match) return false;
  const topOfRange = parseInt(match[2], 10);
  const relevant = history.filter(h => h.day === data.active).sort((a, b) => b.date.localeCompare(a.date));
  const lastSession = relevant.find(h => h.exercises.some(e => e.name === ex.name));
  if (!lastSession) return false;
  const loggedEx = lastSession.exercises.find(e => e.name === ex.name);
  const loggedSets = loggedEx.sets.filter(s => s.reps !== '' && s.reps != null);
  if (!loggedSets.length) return false;
  return loggedSets.every(s => parseInt(s.reps, 10) >= topOfRange);
}

    const addSetBtn = document.createElement('button');
    addSetBtn.className = 'add-set';

    const lastSession = getLastSessionFor(data.active, ex.name);
    if (lastSession) {
      const hist = document.createElement('div');
      hist.className = 'history';
      const best = mode === 'weight' ? bestE1RM(ex.name) : 0;
      hist.innerHTML = `Last time (${lastSession.date}): <strong>${lastSession.summary}</strong>` +
        (best ? `<br>🏆 Best estimated 1-rep max: <strong class="num">${best.toFixed(1)} kg</strong>` : '');

    }

    container.appendChild(card);
  });
}

function getLastSessionFor(dayName, exName) {
  for (let i = history.length - 1; i >= 0; i--) {
    if (history[i].day !== dayName) continue;
    const ex = history[i].exercises.find(e => e.name === exName);
    if (ex) {
      const current = (data.days[dayName] || []).find(e => e.name === exName);
      const summary = formatSets(ex.sets, ex.mode || modeFor(current || ex));
      if (summary) return { date: history[i].date, summary };
    }
  }
  return null;
}

document.getElementById('exercises').addEventListener('click', (e) => {
  const t = e.target;
  const list = currentExercises();
  if (t.dataset.addSet !== undefined) {
    list[+t.dataset.addSet].sets.push({});
    persist(); renderExercises();
  }
  if (t.dataset.removeSet !== undefined) {
    const [exIdx, setIdx] = t.dataset.removeSet.split(':').map(Number);
    const doRemove = () => { list[exIdx].sets.splice(setIdx, 1); persist(); renderExercises(); };
    // Empty sets go straight away; a set with numbers in it asks first.
    if (setHasValue(list[exIdx].sets[setIdx])) {
      showInlineDialog({ message: `Delete set ${setIdx + 1} of ${list[exIdx].name}?`, confirmText: 'Yes, delete', cancelText: 'No', danger: true, onConfirm: doRemove });
    } else doRemove();
  }
  if (t.dataset.removeEx !== undefined) {
    const idx = +t.dataset.removeEx;
    const ex = list[idx];
    const day = data.active;
    showInlineDialog({
      message: `Delete "${ex.name}" from ${day}? Your logged sessions stay in History, and you can bring it back with "Restore removed exercises".`,
      confirmText: 'Yes, delete',
      cancelText: 'No',
      danger: true,
      onConfirm: () => {
        const pos = data.days[day].indexOf(ex);
        if (pos === -1) return;
        data.days[day].splice(pos, 1);
        data.trash = data.trash || [];
        data.trash.unshift({ day, idx: pos, ex: JSON.parse(JSON.stringify(ex)), date: todayStr() });
        data.trash = data.trash.slice(0, 30);
        persist(); renderExercises();
        showToast('Deleted · tap Restore removed exercises to undo');
      }
    });
  }
  if (t.dataset.swapEx !== undefined) {
    const ex = list[+t.dataset.swapEx];
    ex.variantIndex = (ex.variantIndex + 1) % ex.allVariants.length;
    ex.name = ex.allVariants[ex.variantIndex];
    ex.lastRotated = todayStr();
    delete ex.mode; // new variant: let its name decide how it's logged
    persist(); renderExercises();
  }
  if (t.dataset.modeEx !== undefined) {
    const ex = list[+t.dataset.modeEx];
    const order = ['weight', 'reps', 'time'];
    ex.mode = order[(order.indexOf(modeFor(ex)) + 1) % order.length];
    persist(); renderExercises();
  }
  if (t.dataset.done !== undefined) {
    const [exIdx, setIdx] = t.dataset.done.split(':').map(Number);
    const ex = list[exIdx];
    const set = ex.sets[setIdx];
    const mode = modeFor(ex);
    // Ticking an empty set accepts the ghost numbers from last time.
    if (!set.done) {
      const prev = getLastSetsFor(data.active, ex.name);
      const p = prev && (prev[setIdx] || prev[prev.length - 1]);
      if (p) {
        if (mode === 'weight') {
          if (!set.weight && p.weight) set.weight = getProgressionStatus(ex) ? String(Math.round((parseFloat(p.weight) + 2.5) * 100) / 100) : p.weight;
          if (!set.reps && p.reps) set.reps = p.reps;
        } else if (mode === 'reps' && !set.reps && p.reps) set.reps = p.reps;
        else if (mode === 'time' && !set.secs && p.secs) set.secs = p.secs;
      }
    }
    set.done = !set.done;
    markSessionActive();
    persist(); renderExercises();
    if (set.done) {
      keepAwake();
      const isLastSet = ex.sets.every(s => s.done);
      startRest(restFor(ex), isLastSet ? 'Next exercise' : `${ex.name} · set ${setIdx + 2}`);
      if (mode === 'weight' && set.weight && set.reps) {
        const e = e1rm(set.weight, set.reps);
        const prevBest = bestE1RM(ex.name);
        if (prevBest && e > prevBest + 0.01) showToast(`🏆 New best for ${ex.name}: ~${e.toFixed(1)} kg 1RM`);
      }
    }
  }
  if (t.dataset.copyLast !== undefined) {
    const ex = list[+t.dataset.copyLast];
    const prev = getLastSetsFor(data.active, ex.name) || [];
    const bump = getProgressionStatus(ex);
    while (ex.sets.length < prev.length) ex.sets.push({});
    ex.sets.forEach((s, i) => {
      const p = prev[i] || prev[prev.length - 1];
      if (!p) return;
      s.weight = p.weight ? (bump ? String(Math.round((parseFloat(p.weight) + 2.5) * 100) / 100) : p.weight) : (s.weight || '');
      s.reps = p.reps || s.reps || '';
      s.secs = p.secs || s.secs || '';
    });
    markSessionActive();
    persist(); renderExercises();
    showToast(bump ? 'Filled with last time +2.5 kg' : 'Filled from last time');
  }
  if (t.dataset.noteEx !== undefined) {
    const ex = list[+t.dataset.noteEx];
    showInlineFormDialog({
      title: 'Note for ' + ex.name,
      confirmText: 'Save note',
      fields: [{ label: 'Seat height, grip, cues, pain to watch…', placeholder: 'e.g. "Seat on 4, grip just outside shoulders"', value: ex.note || '' }],
      onConfirm: ([note]) => { ex.note = note; persist(); renderExercises(); }
    });
  }
  if (t.dataset.platesEx !== undefined) {
    openPlateDialog(list[+t.dataset.platesEx]);
  }
});

function buildSnapshot(dayName, date) {
  const stretches = getStretchesForDay(dayName);
  const checks = getChecksForDay(dayName);
  return {
    date,
    day: dayName,
    exercises: (data.days[dayName] || []).map(ex => ({
      name: ex.name,
      mode: modeFor(ex),
      sets: ex.sets.map(s => ({ weight: s.weight || '', reps: s.reps || '', secs: s.secs || '', rir: s.rir || '' }))
    })),
    stretchAdherence: {
      pre: { done: Math.min(stretches.pre.length, checks.pre.filter(Boolean).length + (checks.prePack || []).filter(Boolean).length), total: stretches.pre.length },
      post: { done: Math.min(stretches.post.length, checks.post.filter(Boolean).length + (checks.postPack || []).filter(Boolean).length), total: stretches.post.length },
    }
  };
}
function storeSnapshot(snapshot) {
  const existingIdx = history.findIndex(h => h.date === snapshot.date && h.day === snapshot.day);
  if (existingIdx >= 0) {
    if (history[existingIdx].feedback && !snapshot.feedback) snapshot.feedback = history[existingIdx].feedback;
    history[existingIdx] = snapshot;
  } else history.push(snapshot);
  save(HISTORY_KEY, history);
}

document.getElementById('saveBtn').addEventListener('click', () => {
  const today = todayStr();
  // PRs are judged against everything saved before today.
  const prs = [];
  currentExercises().forEach(ex => {
    if (modeFor(ex) !== 'weight') return;
    const before = bestE1RM(ex.name, today);
    const now = Math.max(0, ...ex.sets.map(s => e1rm(s.weight, s.reps)));
    if (now && before && now > before + 0.01) prs.push(`${ex.name} ~${now.toFixed(1)} kg`);
  });
  const snapshot = buildSnapshot(data.active, today);
  storeSnapshot(snapshot);
  data.sessionDate = data.sessionDate || {};
  data.sessionDate[data.active] = today;
  persist();
  showToast('Saved ✓');
  renderExercises();
  openSessionSummary(snapshot, prs);
});

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');

}

document.getElementById('shareBtn').addEventListener('click', async () => {
  const today = todayStr();
  const todaysSession = history.find(h => h.date === today && h.day === data.active);
  const sessionToShare = todaysSession || [...history].reverse().find(h => h.day === data.active);

  let bodyLines = [`${data.active} — ${sessionToShare ? sessionToShare.date : 'no sessions logged yet'}`];
  if (sessionToShare) {
    sessionToShare.exercises.forEach(ex => {
      const sets = formatSets(ex.sets, ex.mode || inferMode(ex.name));
      if (sets) bodyLines.push(`${ex.name}: ${sets}`);
    });
  }
  const shareText = bodyLines.join('\n');
  const shareUrl = window.location.href;

  try {
    if (navigator.share) {
      await navigator.share({ title: 'My Workout Tracker', text: shareText, url: shareUrl });
      return;
    }
    throw new Error('Web Share API not available');
  } catch (err) {
    // Fallback: copy link + summary to clipboard so the user can paste it anywhere
    const fallbackText = `${shareText}\n\n${shareUrl}`;
    try {
      await navigator.clipboard.writeText(fallbackText);
      showToast('Copied — paste to share ✓');
    } catch (clipErr) {
      showInlineDialog({ message: fallbackText, confirmText: 'OK', onConfirm: () => {} });

  }
});

function openStretchEditor(phase, idx) {
  const stretches = getStretchesForDay(data.active);
  const isNew = idx === null;
  const item = isNew ? { name: '', detail: '', cue: '' } : stretches[phase][idx];
  showInlineFormDialog({
    title: isNew ? 'Add stretch' : 'Edit stretch',
    confirmText: isNew ? 'Add' : 'Save',
    fields: [
      { label: 'Name', placeholder: 'e.g. "Standing quad stretch"', value: item.name },
      { label: 'Dosage', placeholder: 'e.g. "30 sec each leg"', value: item.detail },
      { label: 'Form / safety cue (optional)', placeholder: 'e.g. "Keep knees together"', value: item.cue },
    ],
    onDelete: isNew ? null : () => {
      stretches[phase].splice(idx, 1);
      getChecksForDay(data.active)[phase].splice(idx, 1);
      persistStretches(); persistChecks();
      renderNutritionPanel();
    },
    onConfirm: ([name, detail, cue]) => {
      if (!name) return;

      if (isNew) stretches[phase].push(newItem);
      else stretches[phase][idx] = newItem;
      persistStretches();
      renderNutritionPanel();
    }
  });
}

  }
  if (e.target && e.target.id === 'timerStartPause') {
    if (timerState.running) {
      clearInterval(timerState.intervalId);
      timerState.running = false;
    } else {
      timerState.running = true;
      timerState.intervalId = setInterval(tickTimer, 1000);
    }
    renderTimerPanel();
  }
  if (e.target && e.target.id === 'timerSkip') {
    if (timerState.phaseIdx < PHASES.length - 1) {
      timerState.phaseIdx++;
      timerState.remaining = PHASES[timerState.phaseIdx].seconds;
      renderTimerPanel();
    }
  }
  if (e.target && e.target.id === 'timerReset') {
    clearInterval(timerState.intervalId);
    timerState.running = false;
    timerState.phaseIdx = 0;
    timerState.remaining = PHASES[0].seconds;
    renderTimerPanel();
  }
});

function tickTimer() {
  if (timerState.remaining > 0) {
    timerState.remaining--;
  } else if (timerState.phaseIdx < PHASES.length - 1) {
    timerState.phaseIdx++;
    timerState.remaining = PHASES[timerState.phaseIdx].seconds;
    showToast(PHASES[timerState.phaseIdx].emoji + ' ' + PHASES[timerState.phaseIdx].name + ' time!');
  } else {
    clearInterval(timerState.intervalId);
    timerState.running = false;
    showToast('🎉 Session complete!');
  }
  renderTimerPanel();
}

function renderTimerPanel() {
  const panel = document.getElementById('timerPanel');
  const phase = PHASES[timerState.phaseIdx];
  const mm = Math.floor(timerState.remaining / 60).toString().padStart(2, '0');
  const ss = (timerState.remaining % 60).toString().padStart(2, '0');
  const totalSeconds = PHASES.reduce((a, p) => a + p.seconds, 0);
  const elapsedInPhase = phase.seconds - timerState.remaining;
  const elapsedTotal = PHASES.slice(0, timerState.phaseIdx).reduce((a, p) => a + p.seconds, 0) + elapsedInPhase;
  const pct = Math.min(100, Math.round((elapsedTotal / totalSeconds) * 100));
  panel.innerHTML = `
    <div class="card" style="text-align:center;">
      <div style="font-size:0.85rem; color:var(--muted); margin-bottom:4px;">${phase.emoji} ${escapeHtml(phase.name)} — phase ${timerState.phaseIdx + 1} of ${PHASES.length}</div>
      <div style="font-size:2.2rem; font-weight:700; margin-bottom:12px;">${mm}:${ss}</div>
      <div style="height:8px; background:var(--bg); border-radius:4px; overflow:hidden; margin-bottom:14px;">
        <div style="height:100%; width:${pct}%; background:var(--accent); transition:width 0.3s;"></div>
      </div>
      <div style="display:flex; gap:8px; justify-content:center;">
        <button class="secondary" id="timerStartPause" style="flex:1;">${timerState.running ? '⏸ Pause' : '▶ Start'}</button>
        <button class="secondary" id="timerSkip" style="flex:1;">⏭ Skip</button>
        <button class="secondary" id="timerReset" style="flex:1;">↺ Reset</button>
      </div>
    </div>`;
}

    const weights = recent.map(e => e.weight).concat([bwTarget.weight]);
    const minW = Math.min(...weights), maxW = Math.max(...weights);

    const xScale = t => L + (xMax === xMin ? plotW / 2 : ((t - xMin) / (xMax - xMin)) * plotW);

  panel.innerHTML = `
    <div class="card">

// Estimated 1-rep max per session for each loaded lift on this day.
function progressCard(sessions) {
  const sorted = [...sessions].sort((a, b) => a.date.localeCompare(b.date));
  const names = (data.days[data.active] || []).filter(ex => modeFor(ex) === 'weight').map(ex => ex.name);
  const rows = names.map(name => {
    const pts = sorted.map(h => {
      const e = (h.exercises || []).find(x => x.name === name);
      return e ? Math.max(0, ...e.sets.map(s => e1rm(s.weight, s.reps))) : 0;
    }).filter(v => v > 0);
    if (pts.length < 2) return '';
    const W = 120, H = 28, lo = Math.min(...pts), hi = Math.max(...pts), span = (hi - lo) || 1;
    const xy = pts.map((v, i) => [(i / (pts.length - 1)) * (W - 6) + 3, H - 4 - ((v - lo) / span) * (H - 8)]);
    const d = xy.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
    const end = xy[xy.length - 1];
    const delta = pts[pts.length - 1] - pts[0];
    return `<div class="spark"><div style="min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(name)}</div>
      <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true"><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2"/><circle cx="${end[0]}" cy="${end[1]}" r="3" fill="var(--accent)"/></svg>
      <div class="num" style="text-align:right; color:${delta >= 0 ? 'var(--good)' : 'var(--bad)'};">${delta >= 0 ? '+' : ''}${delta.toFixed(1)}</div></div>`;
  }).join('');
  if (!rows) return '';
  return `<div class="card"><div style="font-weight:600; margin-bottom:2px;">📈 Strength trend</div><div style="font-size:0.72rem; color:var(--muted); margin-bottom:10px;">Estimated 1-rep max per session, kg change since first log</div>${rows}</div>`;
}

      : '';
    const fb = session.feedback && (session.feedback.pump || session.feedback.soreness || session.feedback.joints)
      ? `<div class="history" style="margin-top:6px;">Pump: ${session.feedback.pump || '–'} · Soreness: ${session.feedback.soreness || '–'} · Joints: ${session.feedback.joints || '–'}</div>` : '';
    const tag = session.autoArchived ? ` <span style="font-size:0.7rem; color:var(--muted); font-weight:400;">(kept automatically${session.dateGuessed ? ', date approximate' : ''})</span>` : '';
    return `<div class="card"><div style="font-weight:600; margin-bottom:6px;">${session.date}${tag}</div>${rows || '<span class="empty-note">No data logged</span>'}${adherence}${fb}</div>`;
  }).join('');
  panel.innerHTML = progressCard(relevant) + panel.innerHTML;
}

/* ===================== v2: sessions, rest, PRs, volume, backup ===================== */

function fmtClock(s) { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

// Rest by rep range: heavy low-rep work needs longer to recover than pump work.
function restFor(ex) {
  if (ex.rest) return ex.rest;
  const mode = modeFor(ex);
  if (mode !== 'weight') return 60;
  const t = ex.target || '';
  const range = t.match(/(\d+)\s*-\s*(\d+)\s*reps?/i);
  const fixed = t.match(/x\s*(\d+)\s*reps?/i);
  const top = range ? +range[2] : fixed ? +fixed[1] : 10;
  if (top <= 6) return 180;
  if (top <= 10) return 120;
  return 90;
}

function isBarbell(name) {
  const n = (name || '').toLowerCase();
  if (/dumbbell|goblet|split|hack|leg press|single-leg|landmine|machine|cable|bodyweight/.test(n)) return false;

// Epley estimate; above ~12 reps it overestimates, so those sets are ignored.
function e1rm(w, r) {

}

    if (beforeDate && h.date >= beforeDate) return;
    (h.exercises || []).forEach(e => {
      if (e.name !== exName || (e.mode && e.mode !== 'weight')) return;
      (e.sets || []).forEach(s => { best = Math.max(best, e1rm(s.weight, s.reps)); });

function setHasValue(s) { return !!(s && (s.weight || s.reps || s.secs)); }

  for (const h of sorted) {
    const e = (h.exercises || []).find(x => x.name === exName);
    if (e && e.sets.some(setHasValue)) return e.sets.filter(setHasValue);
  }
  return null;
}

function markSessionActive() {
  const today = todayStr();

/* ---------- New-session rollover ---------- */
// When a day is opened on a new date, last session's numbers are archived to
// History (if they weren't saved) and the boxes are emptied. Last time's
// numbers then show faintly as placeholders. One tap on Undo puts them back.
let staleUnknown = {}; // day -> true when old values exist but their date is unknown

function dayHasValues(dayName) {
  return (data.days[dayName] || []).some(ex => ex.sets.some(s => setHasValue(s) || s.done));
}
function sameAsSnapshot(dayName, snap) {
  if (!snap) return false;
  return (data.days[dayName] || []).every(ex => {
    const e = snap.exercises.find(x => x.name === ex.name);
    const cur = ex.sets.filter(setHasValue);
    if (!e) return cur.length === 0;
    const old = e.sets.filter(setHasValue);
    if (cur.length !== old.length) return false;
    return cur.every((s, i) => String(s.weight || '') === String(old[i].weight || '') &&
      String(s.reps || '') === String(old[i].reps || '') && String(s.secs || '') === String(old[i].secs || ''));
  });
}
function clearDaySets(dayName, archivedDate) {
  const today = todayStr();
  data.lastCleared = {
    day: dayName, date: today, archivedDate: archivedDate || null,
    sets: (data.days[dayName] || []).map(ex => ({ name: ex.name, sets: JSON.parse(JSON.stringify(ex.sets)) })),
    checks: JSON.parse(JSON.stringify(getChecksForDay(dayName))),
  };
  (data.days[dayName] || []).forEach(ex => { ex.sets = ex.sets.map(() => ({})); });
  stretchChecks[dayName] = { pre: [], post: [] };
  persistChecks();
  if (data.sessionDate) delete data.sessionDate[dayName];
  delete staleUnknown[dayName];
  persist();
}
function rolloverIfStale(dayName) {
  if (!dayHasValues(dayName)) return;
  const today = todayStr();
  const draft = data.sessionDate && data.sessionDate[dayName];
  if (draft === today) return;
  if (draft) {
    const saved = history.find(h => h.date === draft && h.day === dayName);
    if (!saved) {
      const snap = buildSnapshot(dayName, draft);
      snap.autoArchived = true;
      storeSnapshot(snap);
    }
    clearDaySets(dayName, draft);
    return;
  }
  // Numbers typed before this version have no date. If they match the last
  // saved session they're safe to clear; otherwise ask first.
  const latest = history.filter(h => h.day === dayName).sort((a, b) => b.date.localeCompare(a.date))[0];
  if (latest && latest.date < today && sameAsSnapshot(dayName, latest)) { clearDaySets(dayName, latest.date); return; }
  if (latest && latest.date === today) { data.sessionDate = data.sessionDate || {}; data.sessionDate[dayName] = today; persist(); return; }
  staleUnknown[dayName] = true;
}
function renderRolloverBanner() {
  const el = document.getElementById('rolloverBanner');
  const today = todayStr();

    el.innerHTML = `<div class="banner info"><div>These boxes still hold numbers from an earlier session that wasn't saved. Clear them for today? They'll be kept in History.</div><button class="primary" id="clearStaleBtn" style="padding:9px 12px;">Clear</button></div>`;
    return;
  }
  const lc = data.lastCleared;
  if (lc && lc.day === data.active && lc.date === today && !lc.dismissed) {
    el.innerHTML = `<div class="banner calm"><div>🆕 Fresh session. ${lc.archivedDate ? `Your ${lc.archivedDate} numbers are in History and` : 'Last numbers are'} shown faintly in each box as a guide.</div>
      <div style="display:flex; gap:6px;"><button class="secondary" id="undoClearBtn" style="padding:8px 10px; min-height:0;">Undo</button><button class="del-btn" id="dismissClearBtn" aria-label="Dismiss">✕</button></div></div>`;

}
function undoClear() {

  (data.days[lc.day] || []).forEach(ex => {
    const b = lc.sets.find(x => x.name === ex.name);
    if (b) ex.sets = b.sets;

  stretchChecks[lc.day] = lc.checks || { pre: [], post: [] };

document.body.addEventListener('click', (e) => {

    const latest = history.filter(h => h.day === data.active && h.date < today).sort((a, b) => b.date.localeCompare(a.date))[0];
    let date = addDays(today, -1);
    // Never overwrite a saved session: step back to a free date.
    while (history.some(h => h.day === data.active && h.date === date)) date = addDays(date, -1);
    if (!(latest && sameAsSnapshot(data.active, latest))) {

    clearDaySets(data.active, date);

/* ---------- Training block (mesocycle) ---------- */
// Effort rises week by week (reps in reserve 3 → 0-1), then a lighter
// deload week, then the block repeats.
function mondayOf(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  const shift = (dt.getDay() + 6) % 7;
  return todayStr(new Date(y, m - 1, d - shift));
}
if (!data.meso) { data.meso = { start: mondayOf(todayStr()), length: 6 }; persist(); }
function mesoInfo() {
  const len = Math.max(3, +data.meso.length || 6);
  const elapsed = Math.max(0, daysBetween(data.meso.start, todayStr()));
  const week = (Math.floor(elapsed / 7) % len) + 1;
  const deload = week === len;
  const acc = len - 1;
  let rirNum = deload ? 3 : Math.round(3 - 3 * (week - 1) / Math.max(1, acc - 1));
  const rir = deload ? '3-4' : (rirNum <= 0 ? '0-1' : String(rirNum));
  return { week, len, deload, rir };
}
function renderMesoBanner() {
  const el = document.getElementById('mesoBanner');
  const m = mesoInfo();
  el.innerHTML = (typeof renderTidyNote === 'function' ? renderTidyNote() : '') + (m.deload
    ? `<div class="banner info"><div><strong>Deload · week ${m.week} of ${m.len}</strong><br>Do about half your usual sets, ~10% lighter, stopping 3-4 reps short. A new block starts next week.</div><button class="del-btn" id="mesoEditBtn" aria-label="Edit training block">✏️</button></div>`
    : `<div class="banner calm"><div><strong>Week ${m.week} of ${m.len}</strong> · stop each working set about <strong>${m.rir}</strong> rep${m.rir === '1' ? '' : 's'} short of failure (RIR). Deload in week ${m.len}.</div><button class="del-btn" id="mesoEditBtn" aria-label="Edit training block">✏️</button></div>`);
}
document.body.addEventListener('click', (e) => {
  if (e.target && e.target.id === 'mesoEditBtn') {
    showInlineFormDialog({
      title: 'Training block',
      confirmText: 'Save',
      fields: [
        { label: 'Block started (YYYY-MM-DD)', placeholder: todayStr(), value: data.meso.start },
        { label: 'Weeks per block, including the deload week', placeholder: '6', value: String(data.meso.length) },
      ],
      onConfirm: ([start, len]) => {
        if (/^\d{4}-\d{2}-\d{2}$/.test(start)) data.meso.start = start;
        const n = parseInt(len, 10); if (n >= 3 && n <= 12) data.meso.length = n;
        persist(); renderMesoBanner(); renderExercises();
      }
    });
  }
});

/* ---------- Rest timer ---------- */
let rest = { end: 0, label: '', id: null };
let audioCtx = null;
function beep() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.25].forEach(offset => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = 880; g.gain.value = 0.15;
      o.connect(g); g.connect(audioCtx.destination);
      o.start(audioCtx.currentTime + offset); o.stop(audioCtx.currentTime + offset + 0.15);
    });
  } catch (err) {}
}
function startRest(seconds, label) {
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); } catch (err) {}
  rest.end = Date.now() + seconds * 1000;
  rest.label = label;
  clearInterval(rest.id);
  rest.id = setInterval(tickRest, 250);
  document.getElementById('restBar').hidden = false;
  document.body.classList.add('resting');
  tickRest();
}
function stopRest() {
  clearInterval(rest.id);
  document.getElementById('restBar').hidden = true;
  document.body.classList.remove('resting');
}
function tickRest() {
  const left = (rest.end - Date.now()) / 1000;
  document.getElementById('restTime').textContent = fmtClock(Math.ceil(left));
  document.getElementById('restLabel').textContent = 'Rest · up next: ' + rest.label;
  if (left <= 0) {
    stopRest();
    beep();
    try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (err) {}
    showToast('Rest done · ' + rest.label);
  }
}
document.getElementById('restPlus').addEventListener('click', () => { rest.end += 15000; tickRest(); });
document.getElementById('restMinus').addEventListener('click', () => { rest.end -= 15000; tickRest(); });
document.getElementById('restSkip').addEventListener('click', stopRest);

let wakeLock = null;
async function keepAwake() {
  try { if (!wakeLock && navigator.wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (err) {}
}

/* ---------- Plate calculator & warm-up ramp ---------- */
const PLATES = [25, 20, 15, 10, 5, 2.5, 1.25];

  return { plates: out, leftover: Math.round(side * 2 * 100) / 100 };
}
function roundTo(x, step) { return Math.round(x / step) * step; }
function openPlateDialog(ex) {

  overlay.innerHTML = `<div style="background:var(--card); border-radius:14px; padding:20px; max-width:380px; width:100%; border:1px solid var(--border); max-height:85vh; overflow-y:auto;">

      <label style="font-size:0.78rem; color:var(--muted);">Bar (kg)<input id="plateBar" type="number" inputmode="decimal" value="20"></label>
    </div>

  </div>`;
  document.body.appendChild(overlay);
  const draw = () => {
    const target = parseFloat(overlay.querySelector('#plateTarget').value) || 0;
    const bar = parseFloat(overlay.querySelector('#plateBar').value) || 20;
    const line = (w) => {
      const r = platesFor(w, bar);

    };

      ${ramp}`;
  };
  draw();
  overlay.addEventListener('input', draw);
  overlay.querySelector('#plateClose').addEventListener('click', () => overlay.remove());

// Everything lives in this browser only. A backup is the only way to move it
// to a new phone or recover it after clearing browser data.
const BACKUP_KEY = 'workout_tracker_last_backup_v1';
function collectBackup() {
  const out = {};
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith('workout_tracker') && k !== BACKUP_KEY) out[k] = JSON.parse(localStorage.getItem(k));
    }
  } catch (err) {}
  return { app: 'my-workout-tracker', exported: todayStr(), data: out };
}
function renderBackupPanel() {
  const panel = document.getElementById('backupPanel');
  const last = load(BACKUP_KEY);
  const json = JSON.stringify(collectBackup());
  panel.innerHTML = `<div class="card">

    <div style="font-size:0.78rem; color:var(--muted); margin-bottom:10px;">Your log is stored only in this browser. Copy this and keep it in your notes or email it to yourself. Last backup: <strong>${last || 'never'}</strong>.</div>
    <textarea id="backupOut" readonly aria-label="Backup data">${escapeHtml(json)}</textarea>

    <textarea id="backupIn" aria-label="Paste backup"></textarea>
    <button class="secondary" id="backupRestore" style="width:100%; margin-top:8px;">Restore from backup</button>
  </div>`;
}
document.body.addEventListener('click', async (e) => {
  const id = e.target && e.target.id;
  if (id === 'backupToggleBtn') {

      panel.style.display = 'block'; renderBackupPanel();

    if (!parsed || !parsed.data || !parsed.data[STATE_KEY]) { showToast('That doesn’t look like a backup from this page'); return; }

      message: `Restore the backup from ${parsed.exported || 'an unknown date'}? This replaces what's on this page now.`,
      confirmText: 'Restore',
      onConfirm: () => {

});

/* ---------- Restore removed exercises ---------- */
// Two sources: exercises deleted since this version (kept with their target,
// swaps and notes), and anything logged in History for this day that is no
// longer in the plan, which catches ones deleted before the bin existed.
function removedCandidates(day) {
  const current = new Set((data.days[day] || []).map(e => e.name));
  const out = [], seen = new Set();
  (data.trash || []).forEach((t, ti) => {
    if (t.day !== day || current.has(t.ex.name) || seen.has(t.ex.name)) return;
    seen.add(t.ex.name);
    out.push({ name: t.ex.name, from: 'Deleted ' + t.date, trashIdx: ti });
  });
  const sorted = history.filter(h => h.day === day).sort((a, b) => b.date.localeCompare(a.date));
  sorted.forEach(h => (h.exercises || []).forEach(e => {
    if (current.has(e.name) || seen.has(e.name)) return;
    const logged = (e.sets || []).filter(setHasValue);
    if (!logged.length) return;
    seen.add(e.name);
    out.push({ name: e.name, from: 'Last logged ' + h.date, mode: e.mode, nSets: logged.length });
  }));
  return out;
}
function renderRestorePanel() {
  const panel = document.getElementById('restorePanel');
  const items = removedCandidates(data.active);
  panel.innerHTML = `<div class="card">
    <div style="font-weight:600; margin-bottom:2px;">♻️ Removed from ${escapeHtml(data.active)}</div>
    <div style="font-size:0.75rem; color:var(--muted); margin-bottom:10px;">Restoring puts the exercise back with its history linked up again.</div>
    ${items.length ? items.map((it, i) => `<div style="display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--border);">
      <div style="min-width:0;"><div style="font-weight:600; font-size:0.9rem;">${escapeHtml(it.name)}</div><div style="font-size:0.72rem; color:var(--muted);">${escapeHtml(it.from)}</div></div>
      <button class="primary" data-restore-ex="${i}" style="flex:none; padding:8px 14px;">Restore</button></div>`).join('')
      : `<div class="empty-note">Nothing to restore here. If an exercise was deleted before it was ever saved, add it again with + Add exercise.</div>`}
  </div>`;
}
document.body.addEventListener('click', (e) => {
  const t = e.target;
  if (t.id === 'restoreToggleBtn') {
    const panel = document.getElementById('restorePanel');
    if (panel.style.display === 'none') { panel.style.display = 'block'; renderRestorePanel(); }

  if (t.dataset && t.dataset.restoreEx !== undefined) {
    const it = removedCandidates(data.active)[+t.dataset.restoreEx];
    if (!it) return;

    if (it.trashIdx !== undefined) {

      ex = tr.ex;
      ex.sets = ex.sets.map(() => ({}));
      pos = Math.min(tr.idx, list.length);
      data.trash.splice(it.trashIdx, 1);
    } else {
      const n = it.nSets || 3;
      ex = { name: it.name, target: `${n} sets`, sets: Array.from({ length: n }, () => ({})),
        allVariants: [it.name], variantIndex: 0, anchor: false, lastRotated: todayStr() };

/* ---------- One-time tidy-up (Oct 2026): face pull + preacher curl ---------- */
// A seated cable face pull and a dumbbell preacher curl were logged on
// 15 Oct, possibly in their own new tab. Both belong to Day 3 Pull:
//  - Seated cable face pull is the plan's Face Pull, so it takes over that
//    slot and the old Face Pull history is relinked to the new name.
//  - Dumbbell preacher curl becomes the second curl (the Dumbbell Bicep Curl
//    slot); plain dumbbell, incline and hammer curls stay as its swaps.
// Any extra tab they were in is folded into Pull day, its saved sessions are
// relinked there, and nothing logged is lost. Runs only until 31 Oct.
function tidyFacePullAndPreacher() {
  const FLAG = 'workout_tracker_tidy_facepull_preacher_v1';
  if (load(FLAG) || todayStr() > '2026-10-31') return;
  const FACE = /face\s*-?\s*pull/i, PREACH = /preacher/i;
  const pullDay = data.order.find(d => /pull/i.test(d) && !FACE.test(d) && !PREACH.test(d));
  if (!pullDay) return;
  const pullList = data.days[pullDay];
  const notes = [];
  const incoming = []; // exercise objects to slot into Pull day

  // 1. Extra tabs (not one of the numbered "Day" tabs) holding these moves.
  data.order.slice().forEach(tab => {
    if (tab === pullDay || /^day\s*\d/i.test(tab)) return;
    const list = data.days[tab] || [];
    const tabMatches = FACE.test(tab) || PREACH.test(tab);
    const exMatches = list.length && list.every(ex => FACE.test(ex.name) || PREACH.test(ex.name));
    if (!tabMatches && !exMatches) return;
    // Save anything typed but not saved, so no numbers are lost.
    if (dayHasValues(tab)) {
      const date = (data.sessionDate && data.sessionDate[tab]) || todayStr();
      if (!history.some(h => h.day === tab && h.date === date)) storeSnapshot(buildSnapshot(tab, date));
    }
    // Relink that tab's saved sessions to Pull day.
    const kept = [];
    history.forEach(h => {
      if (h.day !== tab) { kept.push(h); return; }
      const same = kept.find(m => m.day === pullDay && m.date === h.date) ||
        history.find(m => m !== h && m.day === pullDay && m.date === h.date);
      if (same) (h.exercises || []).forEach(e => { if (!same.exercises.some(x => x.name === e.name)) same.exercises.push(e); });
      else { h.day = pullDay; kept.push(h); }
    });
    history = kept;
    list.forEach(ex => incoming.push(Object.assign({}, ex, { sets: ex.sets.map(() => ({})) })));
    delete data.days[tab];
    data.order = data.order.filter(n => n !== tab);
    if (data.active === tab) data.active = pullDay;
    notes.push(`Folded the "${tab}" tab into ${pullDay}`);
  });

  // 2. Duplicates added straight into Pull day (keep their sets).
  for (let i = pullList.length - 1; i >= 0; i--) {
    const ex = pullList[i];
    const dupFace = FACE.test(ex.name) && !/^face pull$/i.test(ex.name) && pullList.some((o, j) => j !== i && (o.allVariants || [o.name]).includes('Face Pull'));
    const dupPreach = PREACH.test(ex.name) && pullList.some((o, j) => j !== i && (o.name === 'Dumbbell Bicep Curl' || (o.allVariants || []).includes('Dumbbell Bicep Curl')));
    if (dupFace || dupPreach) incoming.push(pullList.splice(i, 1)[0]);
  }

  // 3. Slot each incoming move into its place in the plan.
  incoming.forEach(ex => {
    if (FACE.test(ex.name)) {
      const slot = pullList.find(o => (o.allVariants || [o.name]).includes('Face Pull') || FACE.test(o.name));
      if (slot && slot.name !== ex.name) {
        const oldName = slot.name;
        slot.name = ex.name;
        slot.allVariants = [ex.name, ...(slot.allVariants || []).filter(v => v !== ex.name && v !== 'Face Pull')];
        slot.variantIndex = 0;
        if (ex.sets.some(setHasValue)) slot.sets = ex.sets;
        if (ex.note && !slot.note) slot.note = ex.note;
        // Same movement, so its past sessions carry over to the new name.
        if (FACE.test(oldName)) history.forEach(h => { if (h.day === pullDay) (h.exercises || []).forEach(e => { if (e.name === oldName) e.name = ex.name; }); });
        notes.push(`"${ex.name}" now replaces Face Pull, with your face-pull history kept`);
      } else if (!slot) { pullList.push(Object.assign(ex, { anchor: false })); notes.push(`Added "${ex.name}" to ${pullDay}`); }
    } else if (PREACH.test(ex.name)) {
      const slot = pullList.find(o => o.name === 'Dumbbell Bicep Curl' || (o.allVariants || []).includes('Dumbbell Bicep Curl'));
      if (slot) {
        const prev = slot.allVariants && slot.allVariants.length ? slot.allVariants : [slot.name];
        slot.allVariants = [ex.name, ...prev.filter(v => v !== ex.name)];
        slot.name = ex.name;
        slot.variantIndex = 0;
        slot.target = '3 sets x 10-12 reps';
        slot.lastRotated = todayStr();
        delete slot.mode;
        if (ex.sets.some(setHasValue)) slot.sets = ex.sets;
        if (ex.note && !slot.note) slot.note = ex.note;
        notes.push(`"${ex.name}" is now your second curl (tap 🔄 to swap back to dumbbell, incline or hammer curls)`);
      } else if (!pullList.some(o => o.name === ex.name)) {
        pullList.push(Object.assign(ex, { anchor: false, target: ex.target || '3 sets x 10-12 reps' }));
        notes.push(`Added "${ex.name}" to ${pullDay}`);
      }
    }
  });

  if (!notes.length) return; // nothing found yet; try again next open
  save(HISTORY_KEY, history);
  data.tidyNote = { date: todayStr(), notes };
  persist();
  save(FLAG, true);
}

/* ---------- One-time move (Oct 2026): shrugs from Pull day to Day 4 ---------- */
// Pull day already runs about an hour (deadlifts, pulldowns, rows, face pulls,
// two curls), and deadlifts plus rows already work the traps hard and tire the
// grip shrugs depend on. Day 4 is the shortest day, so shrugs go there, last.
function moveShrugsToUpperDay() {
  const FLAG = 'workout_tracker_move_shrugs_v1';
  if (load(FLAG) || todayStr() > '2026-10-31') return;
  const SHRUG = /shrug/i;
  const upperDay = data.order.find(d => /upper/i.test(d));
  if (!upperDay) return;
  const upperList = data.days[upperDay];
  const notes = [];
  data.order.slice().forEach(day => {
    if (day === upperDay) return;
    const list = data.days[day] || [];
    for (let i = list.length - 1; i >= 0; i--) {
      if (!SHRUG.test(list[i].name)) continue;
      const ex = list.splice(i, 1)[0];
      if (!upperList.some(o => SHRUG.test(o.name))) {
        ex.anchor = false;
        if (!ex.target || !/\d/.test(ex.target)) ex.target = '3 sets x 12-15 reps';
        if (!ex.note) ex.note = 'Hold 1 sec at the top, shoulders straight up (no rolling). Use straps if grip goes first.';
        upperList.push(ex);
      }
      notes.push(`Moved "${ex.name}" from ${day} to the end of ${upperDay}`);
    }
    // A tab made only for shrugs is folded away once emptied.
    if (!/^day\s*\d/i.test(day) && SHRUG.test(day) && !list.length) {
      delete data.days[day];
      data.order = data.order.filter(n => n !== day);
      if (data.active === day) data.active = upperDay;
    }
  });
  if (!notes.length) return;
  const prev = data.tidyNote && !data.tidyNote.dismissed ? data.tidyNote.notes : [];
  data.tidyNote = { date: todayStr(), notes: prev.concat(notes) };
  persist();
  save(FLAG, true);
}
moveShrugsToUpperDay();

// Rotational Squat-to-Press (lighter, adds core rotation). Week of Mon
// 2026-10-26 = straight (what was done on Oct 29), next week rotational, etc.
// Each variant keeps its own history because history is keyed by name.
const LM_STRAIGHT = 'Landmine Squat-to-Press';
const LM_ROT = 'Landmine Rotational Squat-to-Press';
const LM_TARGETS = {
  [LM_STRAIGHT]: '3 sets x 10-12 reps',
  [LM_ROT]: '3 sets x 10-12 reps per side, alternating sides'
};
function setupLandmineAlternation() {

  if (!ex) return;
  ex.allVariants = [LM_STRAIGHT, LM_ROT];
  ex.alternateWeekly = { start: '2026-10-26', variants: [LM_STRAIGHT, LM_ROT] };
  // Oct 29 was actually done as the straight version: relabel it.
  if (todayStr() < '2026-11-02') {
    ex.name = LM_STRAIGHT; ex.variantIndex = 0; ex.target = LM_TARGETS[LM_STRAIGHT];
  }

// Every load: put the slot on this week's variant. Last session's numbers
// are archived to History first (the normal new-session rollover), so they
// stay under the name they were done as. Never switches mid-session.
function altWeekIndex(alt, dateStr) {
  const weeks = Math.floor(daysBetween(alt.start, mondayOf(dateStr)) / 7);
  const n = alt.variants.length;
  return ((weeks % n) + n) % n;
}
// Short name for this week's (offset 0) or next week's (offset 1) variant.
function altLabel(ex, offset) {
  const alt = ex.alternateWeekly;
  const i = (altWeekIndex(alt, todayStr()) + offset) % alt.variants.length;
  return (alt.short && alt.short[i]) || alt.variants[i];
}
// Once per week, put each alternating slot on that week's variant. Last
// session's numbers are archived to History first (the normal new-session
// rollover), so they stay under the name they were done as. Never switches
// mid-session, and a 🔄 swap made during the week is left alone until the
// next week starts.
function syncWeeklyAlternates() {
  const today = todayStr();
  const week = mondayOf(today);
  let changed = false;
  data.order.forEach(day => {
    (data.days[day] || []).forEach(ex => {
      const alt = ex.alternateWeekly;
      if (!alt || alt.appliedWeek === week) return;
      const want = alt.variants[altWeekIndex(alt, today)];
      if (ex.name !== want) {
        rolloverIfStale(day);
        if (ex.sets.some(s => setHasValue(s) || s.done)) return; // in progress or unsaved: try again later
        ex.name = want;
        ex.variantIndex = ex.allVariants.indexOf(want);
        if (LM_TARGETS[want]) ex.target = LM_TARGETS[want];
        ex.lastRotated = today;
        delete ex.mode;
      }
      alt.appliedWeek = week;
      changed = true;
    });
  });
  if (changed) persist();
}

/* ---------- 30 Oct 2026, user-confirmed: halve old dumbbell totals ---------- */
// Dumbbell Shrugs and Romanian Deadlift (Dumbbell) were logged as the total
// of both dumbbells (e.g. 60) up to 29 Oct. From now on it's one dumbbell
// (30), so every earlier entry for those two is halved to match. The original
// numbers are kept in a separate backup key in case they're ever needed.
function halveOldDumbbellTotals() {
  const FLAG = 'workout_tracker_halve_db_totals_v1';
  if (load(FLAG)) return;
  const CUTOFF = '2026-10-30';
  const MATCH = /^(dumbbell shrugs|romanian deadlift \(dumbbell\))$/i;
  const half = w => { const n = parseFloat(w); return n ? String(Math.round(n / 2 * 100) / 100) : w; };
  const backup = [];
  let hChanged = false;
  history.forEach(h => {
    if (h.date >= CUTOFF) return;
    (h.exercises || []).forEach(e => {
      if (!MATCH.test(e.name)) return;
      (e.sets || []).forEach((s, i) => {
        if (!s.weight) return;
        backup.push({ day: h.day, date: h.date, name: e.name, set: i, weight: s.weight });
        s.weight = half(s.weight); hChanged = true;
      });
    });
  });
  // Numbers still sitting in the boxes from an earlier, unsaved session.
  data.order.forEach(day => {
    const d = data.sessionDate && data.sessionDate[day];
    if (!d || d >= CUTOFF) return;
    (data.days[day] || []).forEach(ex => {
      if (!MATCH.test(ex.name)) return;
      ex.sets.forEach((s, i) => {
        if (!s.weight) return;
        backup.push({ day, date: d, name: ex.name, set: i, weight: s.weight, draft: true });
        s.weight = half(s.weight);
      });
    });
  });
  if (backup.length) save('workout_tracker_db_totals_backup_v1', backup);
  if (hChanged) save(HISTORY_KEY, history);
  persist();
  save(FLAG, true);
}

function addLandmineRowSwap() {

  if (!vars.includes(LMR)) vars.push(LMR);

// One-off swaps flip back once their day has passed and the old numbers
// have been archived to History.
function revertOneOffSwaps() {
  const today = todayStr();
  let changed = false;
  data.order.forEach(day => {
    (data.days[day] || []).forEach(ex => {
      if (!ex.revert || today <= ex.revert.after) return;
      rolloverIfStale(day);
      if (ex.sets.some(s => setHasValue(s) || s.done)) return;
      ex.name = ex.revert.to;
      ex.variantIndex = (ex.allVariants || []).indexOf(ex.name);
      delete ex.revert;
      delete ex.mode;
      changed = true;
    });
  });
  if (changed) persist();
}
